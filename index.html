<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mercado — Peça e receba em casa</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --green: #16a34a;
      --green-dark: #15803d;
      --green-light: #dcfce7;
      --amber: #f59e0b;
      --bg: #f6f8f6;
      --surface: #ffffff;
      --text: #0f172a;
      --text2: #334155;
      --text3: #64748b;
      --border: #e5e9e6;
      --danger: #dc2626;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow: 0 8px 24px rgba(0,0,0,0.08);
      --shadow-lg: 0 16px 48px rgba(0,0,0,0.14);
      --radius: 14px;
      --radius-sm: 10px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── TOPO ── */
    header {
      background: linear-gradient(135deg, #15803d 0%, #16a34a 55%, #059669 100%);
      color: white;
      padding: 22px 18px 0;
      position: sticky;
      top: 0;
      z-index: 40;
      box-shadow: var(--shadow);
    }

    .topbar {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .logo { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .logo-icon {
      width: 42px; height: 42px; flex: none;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 12px;
      display: grid; place-items: center;
      font-size: 1.4rem;
      backdrop-filter: blur(6px);
    }
    .logo h1 { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.01em; }
    .logo p { font-size: 0.78rem; opacity: 0.88; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .cart-btn {
      position: relative;
      background: white;
      color: var(--green-dark);
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 1.15rem;
      cursor: pointer;
      font-weight: 700;
      box-shadow: var(--shadow-sm);
      flex: none;
    }
    .cart-btn .badge {
      position: absolute;
      top: -7px; right: -7px;
      background: var(--amber);
      color: white;
      font-size: 0.7rem;
      font-weight: 800;
      min-width: 20px; height: 20px;
      border-radius: 999px;
      display: grid; place-items: center;
      padding: 0 5px;
      border: 2px solid white;
    }
    .cart-btn .badge.hidden { display: none; }

    .searchwrap {
      max-width: 1080px;
      margin: 16px auto 0;
      padding-bottom: 16px;
    }
    .search {
      display: flex; align-items: center; gap: 10px;
      background: white;
      border-radius: 12px;
      padding: 12px 14px;
      box-shadow: var(--shadow-sm);
    }
    .search input {
      border: none; outline: none; flex: 1;
      font-size: 0.95rem; font-family: inherit; font-weight: 500;
      background: transparent; color: var(--text);
    }
    .search input::placeholder { color: #9aa6a0; }
    .search .icon { font-size: 1.05rem; }

    /* ── CONTEÚDO ── */
    main { max-width: 1080px; margin: 0 auto; padding: 18px 18px 130px; }

    .banner {
      background: linear-gradient(120deg, #fef3c7, #fde68a);
      border: 1px solid #fcd34d;
      border-radius: var(--radius);
      padding: 16px 18px;
      margin-bottom: 20px;
      display: flex; gap: 12px; align-items: center;
    }
    .banner .icone { font-size: 1.6rem; }
    .banner b { color: #92400e; }
    .banner p { color: #78350f; font-size: 0.88rem; }

    .cats {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 2px 14px;
      scrollbar-width: none;
    }
    .cats::-webkit-scrollbar { display: none; }
    .chip {
      flex: none;
      display: inline-flex; align-items: center; gap: 7px;
      padding: 9px 15px;
      background: white;
      border: 1.5px solid var(--border);
      border-radius: 999px;
      font-size: 0.85rem; font-weight: 600;
      color: var(--text2);
      cursor: pointer;
      transition: all .15s;
    }
    .chip:hover { border-color: var(--green); }
    .chip.active {
      background: var(--green);
      border-color: var(--green);
      color: white;
      box-shadow: 0 4px 12px rgba(22,163,74,0.3);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
      gap: 12px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      display: flex; flex-direction: column;
      gap: 8px;
      transition: transform .15s, box-shadow .15s;
    }
    .card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .card .emoji {
      width: 100%; height: 74px;
      display: grid; place-items: center;
      font-size: 2.6rem;
      background: linear-gradient(135deg, #f0fdf4, #ecfdf5);
      border-radius: var(--radius-sm);
    }
    .card h3 { font-size: 0.92rem; font-weight: 700; line-height: 1.25; }
    .card .desc { font-size: 0.76rem; color: var(--text3); flex: 1; }
    .card .linha {
      display: flex; align-items: center;
      justify-content: space-between; gap: 8px;
    }
    .card .preco { font-size: 1rem; font-weight: 800; color: var(--green-dark); }
    .card .preco small { font-size: 0.7rem; font-weight: 500; color: var(--text3); display: block; }

    .qty {
      display: inline-flex; align-items: center;
      background: var(--green-light);
      border-radius: 10px; overflow: hidden;
    }
    .qty button {
      width: 30px; height: 30px;
      border: none; background: transparent;
      font-size: 1.1rem; font-weight: 800;
      color: var(--green-dark); cursor: pointer;
      display: grid; place-items: center;
    }
    .qty button:hover { background: #bbf7d0; }
    .qty span { min-width: 26px; text-align: center; font-weight: 700; font-size: 0.9rem; }

    .addone {
      border: none; cursor: pointer;
      background: var(--green); color: white;
      font-weight: 700; font-size: 0.82rem;
      border-radius: 10px; padding: 8px 12px;
      transition: background .15s;
    }
    .addone:hover { background: var(--green-dark); }

    .empty {
      text-align: center; padding: 48px 16px; color: var(--text3);
    }
    .empty .big { font-size: 3rem; margin-bottom: 10px; }

    /* ── CARRINHO FLUTUANTE ── */
    .cartbar {
      position: fixed;
      left: 50%; transform: translateX(-50%);
      bottom: 16px; width: calc(100% - 36px); max-width: 560px;
      background: var(--green-dark);
      color: white;
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      z-index: 45;
      display: flex; align-items: center; justify-content: space-between;
      padding: 13px 18px;
      cursor: pointer;
      border: none;
      transition: transform .2s, opacity .2s;
    }
    .cartbar.hidden { transform: translate(-50%, 120%); opacity: 0; pointer-events: none; }
    .cartbar .info { display: flex; align-items: center; gap: 12px; }
    .cartbar .icon {
      width: 36px; height: 36px; flex: none;
      background: rgba(255,255,255,0.2);
      border-radius: 10px; display: grid; place-items: center; font-size: 1.05rem;
    }
    .cartbar b { font-size: 0.98rem; }
    .cartbar small { display: block; font-size: 0.8rem; opacity: 0.85; font-weight: 500; }
    .cartbar .go {
      background: white; color: var(--green-dark);
      font-weight: 800; font-size: 0.9rem;
      padding: 10px 16px; border-radius: 10px;
    }

    /* ── DRAWER CARRINHO ── */
    .drawer { position: fixed; inset: 0; z-index: 60; visibility: hidden; }
    .drawer.open { visibility: visible; }
    .overlay {
      position: absolute; inset: 0;
      background: rgba(15,23,42,0.5);
      opacity: 0; transition: opacity .25s;
    }
    .drawer.open .overlay { opacity: 1; }
    .sheet {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: white;
      border-radius: 22px 22px 0 0;
      max-height: 88vh;
      display: flex; flex-direction: column;
      transform: translateY(100%);
      transition: transform .3s cubic-bezier(.32,.72,.24,1);
    }
    .drawer.open .sheet { transform: translateY(0); }
    .sheet .handle { width: 44px; height: 5px; background: #d6ddd8; border-radius: 999px; margin: 12px auto 4px; }
    .sheet h2 { font-size: 1.1rem; font-weight: 800; padding: 8px 20px 6px; }
    .sheet .items { overflow-y: auto; padding: 4px 20px 10px; flex: 1; }
    .cart-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 0; border-bottom: 1px solid var(--border);
    }
    .cart-item .em { font-size: 1.5rem; }
    .cart-item .nome { flex: 1; font-size: 0.88rem; font-weight: 600; }
    .cart-item .preco { font-size: 0.85rem; color: var(--text3); font-weight: 600; }
    .cart-item .qty { flex: none; }
    .sheet .totais { padding: 14px 20px; border-top: 1px dashed var(--border); }
    .sheet .row { display: flex; justify-content: space-between; font-size: 0.86rem; color: var(--text3); padding: 2px 0; }
    .sheet .row.total { font-size: 1.05rem; color: var(--text); font-weight: 800; border-top: 1px solid var(--border); padding-top: 8px; margin-top: 6px; }
    .sheet .row.total span:last-child { color: var(--green-dark); }

    .btn {
      display: block; width: 100%;
      background: var(--green); color: white;
      border: none; border-radius: 12px;
      padding: 14px; font-size: 0.98rem; font-weight: 800;
      cursor: pointer; font-family: inherit;
      transition: background .15s;
    }
    .btn:hover { background: var(--green-dark); }
    .btn.ghost { background: #eef2ef; color: var(--text2); }
    .btn.ghost:hover { background: #e2e8e4; }

    .sheet .actions { padding: 0 20px 24px; display: grid; gap: 9px; }
    .btn-close-cart { background: none; border: none; color: var(--text3); font-size: 1.3rem; cursor: pointer; }

    /* ── MODAIS ── */
    .modal { position: fixed; inset: 0; z-index: 70; display: none; align-items: flex-end; }
    .modal.open { display: flex; }
    .modal .overlayR {
      position: absolute; inset: 0; background: rgba(15,23,42,0.55);
    }
    .modal .box {
      position: relative;
      width: 100%; max-width: 560px;
      margin: 0 auto;
      background: white;
      border-radius: 22px 22px 0 0;
      max-height: 92vh;
      display: flex; flex-direction: column;
      animation: up .28s cubic-bezier(.32,.72,.24,1);
    }
    @keyframes up { from { transform: translateY(60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal .body { overflow-y: auto; padding: 20px; }

    .stepbar { display: flex; gap: 6px; padding: 0 20px 14px; }
    .stepbar .seg { flex: 1; height: 5px; background: #e5e9e6; border-radius: 999px; }
    .stepbar .seg.on { background: var(--green); }

    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 0.82rem; font-weight: 700; color: var(--text2); margin-bottom: 6px; }
    .field input, .field textarea, .field select {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 12px 13px;
      font-size: 0.92rem;
      font-family: inherit;
      outline: none;
      background: white; color: var(--text);
      transition: border-color .15s;
    }
    .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--green); }
    .field textarea { min-height: 66px; resize: vertical; }

    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .pag-opts { display: grid; gap: 9px; }
    .pag-item {
      display: flex; align-items: center; gap: 11px;
      border: 1.5px solid var(--border);
      border-radius: 12px; padding: 12px 14px;
      cursor: pointer; transition: all .15s;
    }
    .pag-item.selected { border-color: var(--green); background: var(--green-light); }
    .pag-item .ic { font-size: 1.4rem; }
    .pag-item .tx { flex: 1; }
    .pag-item .tx b { display: block; font-size: 0.92rem; }
    .pag-item .tx small { color: var(--text3); font-size: 0.78rem; }
    .pag-item .radio {
      width: 20px; height: 20px; flex: none;
      border: 2px solid #c8d0cc; border-radius: 999px;
      display: grid; place-items: center;
    }
    .pag-item.selected .radio { border-color: var(--green); }
    .pag-item.selected .radio::after { content: ''; width: 10px; height: 10px; border-radius: 999px; background: var(--green); }

    .troco { margin-top: 10px; }

    .resumo { background: #f6f8f6; border-radius: 12px; padding: 14px; margin-bottom: 16px; }
    .resumo .tit { font-weight: 800; font-size: 0.88rem; margin-bottom: 8px; }
    .resumo .l { display: flex; justify-content: space-between; gap: 10px; font-size: 0.82rem; color: var(--text2); padding: 3px 0; }
    .resumo .l.total { font-weight: 800; color: var(--text); font-size: 1rem; border-top: 1px dashed var(--border); margin-top: 6px; padding-top: 8px; }

    .alert {
      background: #fef2f2; border: 1px solid #fecaca;
      color: #b91c1c; border-radius: 10px;
      padding: 11px 13px; font-size: 0.84rem; font-weight: 600;
      margin-bottom: 14px; display: none;
    }
    .alert.show { display: block; }

    /* ── CONFIRMAÇÃO ── */
    .ok { text-align: center; padding: 22px 6px 10px; }
    .ok .badgebig { font-size: 3.4rem; }
    .ok h2 { font-size: 1.35rem; font-weight: 800; margin: 6px 0 4px; }
    .ok p { color: var(--text3); font-size: 0.92rem; }
    .codigo {
      display: inline-block;
      background: var(--green-light);
      color: var(--green-dark);
      font-size: 1.7rem; font-weight: 800;
      letter-spacing: 2px;
      padding: 10px 26px;
      border-radius: 14px;
      border: 2px dashed var(--green);
      margin: 16px 0 6px;
    }
    .passos { text-align: left; max-width: 400px; margin: 14px auto 0; display: grid; gap: 8px; }
    .passos .p {
      display: flex; gap: 10px; align-items: flex-start;
      font-size: 0.86rem; color: var(--text2);
      background: #f6f8f6; border-radius: 10px; padding: 10px 12px;
    }

    /* ── RASTREIO ── */
    .track-status {
      display: flex; align-items: center; gap: 12px;
      background: var(--green-light); border: 1px solid #bbf7d0;
      border-radius: 12px; padding: 13px 16px; margin-bottom: 16px;
    }
    .track-status .ic { font-size: 1.6rem; }
    .track-status b { display: block; font-size: 0.95rem; color: var(--green-dark); }
    .track-status small { opacity: 0.75; font-size: 0.78rem; }
    .timeline { position: relative; padding-left: 22px; }
    .timeline::before { content: ''; position: absolute; left: 6px; top: 8px; bottom: 8px; width: 2px; background: #dbe3de; }
    .tl-item { position: relative; padding: 7px 0 7px 14px; color: var(--text3); font-size: 0.86rem; }
    .tl-item::before {
      content: ''; position: absolute; left: -21px; top: 11px;
      width: 12px; height: 12px; border-radius: 999px;
      border: 2px solid #dbe3de; background: white;
    }
    .tl-item.done { color: var(--text2); font-weight: 600; }
    .tl-item.done::before { background: var(--green); border-color: var(--green); }
    .tl-item small { color: var(--text3); font-weight: 500; }

    /* ── RODAPÉ ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 26px 18px 36px;
      background: white;
      text-align: center;
      color: var(--text3); font-size: 0.82rem;
    }
    footer .lk {
      background: none; border: none; cursor: pointer;
      color: var(--green-dark); font-weight: 700;
      font-family: inherit; font-size: 0.85rem;
      margin: 10px 6px 0;
    }
    .min-order {
      background: #fffbeb; border: 1px solid #fde68a;
      color: #92400e; font-size: 0.85rem; font-weight: 600;
      border-radius: 10px; padding: 12px 14px; margin-bottom: 14px;
      text-align: center;
    }

    @media (min-width: 620px) {
      .modal { align-items: center; padding: 20px; }
      .modal .box { border-radius: 20px; margin: 0 auto; }
    }
  </style>
</head>
<body>

  <header>
    <div class="topbar">
      <div class="logo">
        <div class="logo-icon" id="logoIcon">🛒</div>
        <div>
          <h1 id="lojaNome">Mercado Bom Preço</h1>
          <p id="lojaSlogan">Tudo entregue na sua porta</p>
        </div>
      </div>
      <button class="cart-btn" onclick="abrirCarrinho()" aria-label="Abrir carrinho">
        🛒<span class="badge hidden" id="cartBadge">0</span>
      </button>
    </div>
    <div class="searchwrap">
      <div class="search">
        <span class="icon">🔍</span>
        <input id="busca" type="search" placeholder="Buscar no mercado..." autocomplete="off">
      </div>
    </div>
  </header>

  <main>
    <div class="banner">
      <div class="icone">🛵</div>
      <div>
        <b id="bannerUnt">Entregamos na sua região!</b>
        <p id="bannerSub">Pedido mínimo de R$ 20,00 • Frete grátis acima de R$ 99,00 em produtos</p>
      </div>
    </div>

    <div class="cats" id="cats"></div>
    <div class="grid" id="grid"></div>
    <div class="empty hidden" id="empty">
      <div class="big">🥲</div>
      <b>Nenhum produto encontrado</b>
      <p>Tente outra busca ou categoria.</p>
    </div>
  </main>

  <button class="cartbar hidden" id="cartbar" onclick="abrirCarrinho()">
    <div class="info">
      <div class="icon">🛒</div>
      <div>
        <small id="cartbarQtd">0 itens</small>
        <b id="cartbarTotal">R$ 0,00</b>
      </div>
    </div>
    <div class="go">Ver carrinho →</div>
  </button>

  <!-- Drawer do carrinho -->
  <div class="drawer" id="drawer">
    <div class="overlay" onclick="fecharCarrinho()"></div>
    <div class="sheet">
      <div class="handle"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:0 20px;">
        <h2>🛒 Sua sacola</h2>
        <button class="btn-close-cart" onclick="fecharCarrinho()">✕</button>
      </div>
      <div class="items" id="cartItems"></div>
      <div class="totais" id="cartTotais"></div>
      <div class="actions">
        <button class="btn hidden" id="btnFinalizar" onclick="iniciarCheckout()">Finalizar pedido</button>
        <button class="btn ghost" onclick="fecharCarrinho()">Continuar comprando</button>
      </div>
    </div>
  </div>

  <!-- Checkout -->
  <div class="modal" id="modalCheckout">
    <div class="overlayR" onclick="fecharCheckout()"></div>
    <div class="box">
      <div class="stepbar" id="stepbar">
        <div class="seg on"></div><div class="seg"></div><div class="seg"></div>
      </div>
      <div class="body" id="checkoutBody"></div>
    </div>
  </div>

  <!-- Rastreio -->
  <div class="modal" id="modalRastreio">
    <div class="overlayR" onclick="this.parentElement.classList.remove('open')"></div>
    <div class="box">
      <div class="body" id="rastreioBody"></div>
    </div>
  </div>

  <footer>
    <b id="footNome" style="color:var(--text2)">Mercado Bom Preço</b>
    <p id="footHorario" style="margin-top:4px">Todos os dias, das 7h às 22h</p>
    <p id="footTaxa" style="margin-top:4px"></p>
    <div>
      <button class="lk" onclick="abrirRastreio()">📦 Rastrear meu pedido</button>
      <button class="lk" onclick="window.location.href='admin.html'">Painel do mercado</button>
    </div>
  </footer>

  <script src="app.js"></script>
  <script>
    const M = window.MERCADO;

    let catAtiva = null;
    let filtro = '';

    function aplicarConfig() {
      const c = M.config();
      document.getElementById('lojaNome').textContent = c.nomeMercado;
      document.getElementById('lojaSlogan').textContent = c.slogan || '';
      document.getElementById('footNome').textContent = c.nomeMercado;
      document.getElementById('footHorario').textContent = c.horario || '';
      document.getElementById('bannerSub').textContent =
        'Pedido mínimo de ' + M.formatarPreco(c.pedidoMinimo) +
        ' • Frete grátis acima de ' + M.formatarPreco(c.freteGratisAcima) + ' em produtos';
      document.getElementById('footTaxa').textContent = 'Taxa de entrega: ' + M.formatarPreco(c.taxaEntrega);
      document.title = c.nomeMercado + ' — Peça e receba em casa';
    }

    function listarCategorias() {
      const el = document.getElementById('cats');
      el.innerHTML = '';
      const todas = document.createElement('button');
      todas.className = 'chip' + (catAtiva === null ? ' active' : '');
      todas.innerHTML = '🛍️ <span>Todas</span>';
      todas.onclick = () => { catAtiva = null; listarCategorias(); listarProdutos(); };
      el.appendChild(todas);
      M.categorias().forEach(cat => {
        const b = document.createElement('button');
        b.className = 'chip' + (catAtiva === cat.nome ? ' active' : '');
        b.innerHTML = M.emojiCategoria(cat.nome) + ' <span>' + cat.nome + '</span>';
        b.onclick = () => { catAtiva = cat.nome; listarCategorias(); listarProdutos(); };
        el.appendChild(b);
      });
    }

    function listarProdutos() {
      const grid = document.getElementById('grid');
      const empty = document.getElementById('empty');
      const termo = filtro.trim().toLowerCase();
      let lista = M.produtos().filter(p => p.disponivel !== false);
      if (catAtiva) lista = lista.filter(p => p.categoria === catAtiva);
      if (termo) lista = lista.filter(p => (p.nome + ' ' + p.categoria + ' ' + (p.descricao || '')).toLowerCase().includes(termo));
      lista.sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));

      grid.innerHTML = '';
      empty.classList.toggle('hidden', lista.length > 0);
      const cesta = M.lerCesta();
      lista.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card';
        const cont = cesta.find(i => i.id === p.id);
        card.innerHTML =
          '<div class="emoji">' + (p.emoji || '🛒') + '</div>' +
          '<h3>' + valor(p.nome) + '</h3>' +
          '<p class="desc">' + valor(p.descricao || p.categoria) + '</p>' +
          '<div class="linha">' +
            '<div class="preco">' + M.formatarPreco(p.preco) + '<small>' + (p.unidade || '') + '</small></div>' +
            (cont
              ? '<div class="qty"><button onclick="aj(\'' + p.id + '\',-1)">−</button><span>' + cont.qtd + '</span><button onclick="aj(\'' + p.id + '\',1)">+</button></div>'
              : '<button class="addone" onclick="aj(\'' + p.id + '\',1)">Adicionar</button>') +
          '</div>';
        grid.appendChild(card);
      });
    }

    function valor(s) {
      const div = document.createElement('div');
      div.textContent = s == null ? '' : s;
      return div.innerHTML;
    }

    function atualizarUI() {
      const cesta = M.lerCesta();
      const qtd = M.cestaQtdTotal(cesta);
      const badge = document.getElementById('cartBadge');
      badge.textContent = qtd;
      badge.classList.toggle('hidden', qtd === 0);
      const bar = document.getElementById('cartbar');
      const totais = cesta.length ? M.calcularTotais(cesta) : null;
      bar.classList.toggle('hidden', !cesta.length);
      if (cesta.length) {
        document.getElementById('cartbarQtd').textContent = qtd + (qtd === 1 ? ' item' : ' itens');
        document.getElementById('cartbarTotal').textContent = M.formatarPreco(totais.total);
      }
    }

    function aj(id, delta) {
      const cesta = M.lerCesta();
      const i = cesta.find(x => x.id === id);
      if (i) {
        i.qtd += delta;
        if (i.qtd <= 0) cesta.splice(cesta.indexOf(i), 1);
      } else if (delta > 0) {
        cesta.push({ id, qtd: 1 });
      }
      M.salvarCesta(cesta);
      listarProdutos();
      atualizarUI();
    }

    function abrirCarrinho() {
      renderCarrinho();
      document.getElementById('drawer').classList.add('open');
    }
    function fecharCarrinho() {
      document.getElementById('drawer').classList.remove('open');
    }

    function renderCarrinho() {
      const totais = M.calcularTotais(M.lerCesta());
      const el = document.getElementById('cartItems');
      const btn = document.getElementById('btnFinalizar');
      const min = M.config().pedidoMinimo;
      const abaixo = totais.subtotal > 0 && totais.subtotal < min;

      if (!totais.itens.length) {
        el.innerHTML = '<div class="empty"><div class="big">🛒</div><b>Sua sacola está vazia</b><p>Adicione produtos para começar.</p></div>';
        btn.classList.add('hidden');
      } else {
        el.innerHTML = totais.itens.map(i =>
          '<div class="cart-item">' +
            '<span class="em">' + i.emoji + '</span>' +
            '<span class="nome">' + valor(i.nome) + '<br><span class="preco">' + M.formatarPreco(i.precoUnit) + ' x ' + i.qtd + '</span></span>' +
            '<span class="preco">' + M.formatarPreco(i.subtotal) + '</span>' +
            '<div class="qty"><button onclick="aj(\'' + i.produtoId + '\',-1)">−</button><span>' + i.qtd + '</span><button onclick="aj(\'' + i.produtoId + '\',1)">+</button></div>' +
          '</div>'
        ).join('');
        btn.classList.remove('hidden');
        if (abaixo) btn.textContent = 'Faltam ' + M.formatarPreco(min - totais.subtotal) + ' para o pedido mínimo';
        else btn.textContent = 'Finalizar pedido';
        btn.disabled = abaixo;
        btn.style.opacity = abaixo ? '0.5' : '1';
      }

      document.getElementById('cartTotais').innerHTML =
        '<div class="row"><span>Subtotal</span><span>' + M.formatarPreco(totais.subtotal) + '</span></div>' +
        '<div class="row"><span>Entrega</span><span>' + (totais.entrega === 0 ? 'Grátis' : M.formatarPreco(totais.entrega)) + '</span></div>' +
        '<div class="row total"><span>Total</span><span>' + M.formatarPreco(totais.total) + '</span></div>';
    }

    let passoSel = 1;
    let formDados = {};
    let pagamentoSel = 'dinheiro';

    function iniciarCheckout() {
      passoSel = 1;
      formDados = {};
      pagamentoSel = 'dinheiro';
      document.getElementById('modalCheckout').classList.add('open');
      renderCheckout();
    }
    function fecharCheckout() {
      document.getElementById('modalCheckout').classList.remove('open');
      document.getElementById('drawer').classList.remove('open');
    }

    function renderCheckout() {
      const body = document.getElementById('checkoutBody');
      const segs = document.querySelectorAll('#stepbar .seg');
      segs.forEach((s, i) => s.classList.toggle('on', i < passoSel));

      const totais = M.calcularTotais(M.lerCesta());
      if (!totais.itens.length) { fecharCheckout(); return; }

      if (passoSel === 1) {
        body.innerHTML =
          '<h2 style="font-size:1.1rem;font-weight:800;margin-bottom:14px">📍 Dados para entrega</h2>' +
          '<div class="field"><label>Nome completo</label><input id="f_nome" placeholder="Seu nome"></div>' +
          '<div class="field"><label>WhatsApp com DDD</label><input id="f_tel" inputmode="tel" placeholder="(00) 00000-0000"></div>' +
          '<div class="row2">' +
            '<div class="field"><label>Rua</label><input id="f_rua" placeholder="Rua e número"></div>' +
            '<div class="field"><label>Bairro</label><input id="f_bairro" placeholder="Bairro"></div>' +
          '</div>' +
          '<div class="field"><label>Complemento (opcional)</label><input id="f_comp" placeholder="Apto, bloco, ponto de referência"></div>' +
          '<div class="field"><label>Observações (opcional)</label><textarea id="f_obs" placeholder="Ex.: tocar interfone, deixar na portaria..."></textarea></div>' +
          '<button class="btn" onclick="passo2()">Continuar para pagamento →</button>';
      } else if (passoSel === 2) {
        body.innerHTML =
          '<h2 style="font-size:1.1rem;font-weight:800;margin-bottom:6px">💳 Como quer pagar?</h2>' +
          '<p style="color:var(--text3);font-size:0.82rem;margin-bottom:14px">O pagamento é combinado na entrega. Escolha a forma:</p>' +
          '<div class="pag-opts">' +
            '<div class="pag-item" data-p="dinheiro" onclick="selPag(\'dinheiro\')"><span class="ic">💵</span><span class="tx"><b>Dinheiro</b><small>Pague ao entregador</small></span><span class="radio"></span></div>' +
            '<div class="pag-item" data-p="pix" onclick="selPag(\'pix\')"><span class="ic">⚡</span><span class="tx"><b>PIX</b><small>Transferência na entrega</small></span><span class="radio"></span></div>' +
            '<div class="pag-item" data-p="cartao" onclick="selPag(\'cartao\')"><span class="ic">💳</span><span class="tx"><b>Cartão</b><small>Débito ou crédito na maquininha</small></span><span class="radio"></span></div>' +
          '</div>' +
          '<div class="field troco hidden" id="campoTroco"><label>Precisa de troco para quanto?</label><input id="f_troco" inputmode="decimal" placeholder="Ex.: 100"></div>' +
          '<div style="margin-top:14px"><button class="btn" onclick="passo3()">Revisar pedido →</button></div>' +
          '<button class="btn ghost" style="margin-top:9px" onclick="passoSel=1;renderCheckout()">← Voltar</button>';
        selPagDOM();
      } else if (passoSel === 3) {
        const pagLabel = { dinheiro: '💵 Dinheiro', pix: '⚡ PIX', cartao: '💳 Cartão' }[pagamentoSel];
        body.innerHTML =
          '<h2 style="font-size:1.1rem;font-weight:800;margin-bottom:14px">📋 Confirme seu pedido</h2>' +
          '<div class="resumo">' +
            '<div class="tit">Itens (' + totais.itens.length + ')</div>' +
            totais.itens.map(i => '<div class="l"><span>' + i.qtd + 'x ' + valor(i.nome) + '</span><span>' + M.formatarPreco(i.subtotal) + '</span></div>').join('') +
            '<div class="l"><span>Entrega</span><span>' + (totais.entrega === 0 ? 'Grátis' : M.formatarPreco(totais.entrega)) + '</span></div>' +
            '<div class="l total"><span>Total</span><span>' + M.formatarPreco(totais.total) + '</span></div>' +
          '</div>' +
          '<div class="resumo">' +
            '<div class="tit">Entrega</div>' +
            '<div class="l"><span>Cliente</span><span>' + valor(formDados.nome) + '</span></div>' +
            '<div class="l"><span>Telefone</span><span>' + valor(formDados.tel) + '</span></div>' +
            '<div class="l"><span>Endereço</span><span>' + valor(formDados.rua) + ' — ' + valor(formDados.bairro) + (formDados.comp ? ', ' + valor(formDados.comp) : '') + '</span></div>' +
            (formDados.obs ? '<div class="l"><span>Obs.</span><span>' + valor(formDados.obs) + '</span></div>' : '') +
          '</div>' +
          '<div class="resumo">' +
            '<div class="tit">Pagamento</div>' +
            '<div class="l"><span>' + pagLabel + '</span><span>' + (formDados.troco ? 'troco p/ ' + M.formatarPreco(formDados.troco) : '—') + '</span></div>' +
          '</div>' +
          '<button class="btn" onclick="confirmarPedido()">Confirmar pedido ✓</button>' +
          '<button class="btn ghost" style="margin-top:9px" onclick="passoSel=2;renderCheckout()">← Voltar</button>';
      }
    }

    function selPag(p) {
      pagamentoSel = p;
      selPagDOM();
    }
    function selPagDOM() {
      document.querySelectorAll('.pag-item').forEach(el => el.classList.toggle('selected', el.dataset.p === pagamentoSel));
      document.getElementById('campoTroco') && document.getElementById('campoTroco').classList.toggle('hidden', pagamentoSel !== 'dinheiro');
    }

    function passo2() {
      const g = id => document.getElementById(id).value.trim();
      formDados = {
        nome: g('f_nome'), tel: g('f_tel'), rua: g('f_rua'),
        bairro: g('f_bairro'), comp: g('f_comp'), obs: g('f_obs'),
      };
      if (!formDados.nome || !formDados.tel || !formDados.rua || !formDados.bairro) {
        alert('Preencha nome, telefone, rua e bairro para continuar.');
        return;
      }
      passoSel = 2;
      renderCheckout();
    }

    function passo3() {
      formDados.troco = null;
      const troco = document.getElementById('f_troco');
      if (troco && troco.value.trim()) formDados.troco = parseFloat(troco.value.replace(',', '.')) || null;
      passoSel = 3;
      renderCheckout();
    }

    function confirmarPedido() {
      const totais = M.calcularTotais(M.lerCesta());
      const pedido = M.criarPedido({
        itens: totais.itens.map(i => ({
          produtoId: i.produtoId, nome: i.nome, qtd: i.qtd,
          precoUnit: i.precoUnit, subtotal: i.subtotal,
        })),
        subtotal: totais.subtotal,
        entrega: totais.entrega,
        total: totais.total,
        cliente: formDados,
        pagamento: { metodo: pagamentoSel, troco: formDados.troco || null },
      });
      M.salvarCesta([]);
      atualizarUI();
      mostrarConfirmacao(pedido);
    }

    function mostrarConfirmacao(pedido) {
      const body = document.getElementById('checkoutBody');
      document.querySelectorAll('#stepbar .seg').forEach(s => s.classList.remove('on'));
      const pagTxt = { dinheiro: 'Dinheiro na entrega', pix: 'PIX na entrega', cartao: 'Cartão na entrega' }[pedido.pagamento.metodo] || '';
      body.innerHTML =
        '<div class="ok">' +
          '<div class="badgebig">🎉</div>' +
          '<h2>Pedido recebido!</h2>' +
          '<p>Anote seu código para acompanhar:</p>' +
          '<div class="codigo">' + pedido.codigo + '</div>' +
          '<div class="passos">' +
            '<div class="p"><span>🧾</span><span>Total: <b>' + M.formatarPreco(pedido.total) + '</b> — ' + pagTxt + '</span></div>' +
            '<div class="p"><span>🕐</span><span>O mercado confirmará em breve pelo ' + valor(pedido.cliente.tel) + '.</span></div>' +
            '<div class="p"><span>🛵</span><span>Acompanhe o status com o código acima.</span></div>' +
          '</div>' +
        '</div>' +
        '<button class="btn" style="margin-top:18px" onclick="fecharCheckout()">Continuar comprando</button>';
    }

    function abrirRastreio() {
      const body = document.getElementById('rastreioBody');
      const p = M.buscarPedido(document.getElementById('rastreioInput') ? document.getElementById('rastreioInput').value : '');
      if (p) {
        const st = M.statusInfo(p.status);
        const hist = p.historico || [{ status: p.status, em: p.criadoEm }];
        body.innerHTML =
          '<h2 style="font-size:1.1rem;font-weight:800;margin-bottom:14px">📦 Seu pedido</h2>' +
          '<div class="track-status"><div class="ic">' + stEmoji(p.status) + '</div><div><b>' + st.rotulo + '</b><small>Pedido ' + p.codigo + '</small></div></div>' +
          '<div class="resumo">' +
            p.itens.map(i => '<div class="l"><span>' + i.qtd + 'x ' + valor(i.nome) + '</span><span>' + M.formatarPreco(i.subtotal) + '</span></div>').join('') +
            '<div class="l total"><span>Total</span><span>' + M.formatarPreco(p.total) + '</span></div>' +
          '</div>' +
          '<div class="timeline">' +
            mapStatus(p).map(s => {
              const info = M.statusInfo(s.id);
              const done = indiceStatus(p, s.id) >= 0;
              return '<div class="tl-item' + (done ? ' done' : '') + '">' + info.rotulo + (done && s.em ? '<br><small>' + fmtData(s.em) + '</small>' : '') + '</div>';
            }).join('') +
          '</div>' +
          '<button class="btn ghost" style="margin-top:18px" onclick="ferrarRastreio()">Fechar</button>';
      } else {
        body.innerHTML =
          '<h2 style="font-size:1.1rem;font-weight:800;margin-bottom:14px">📦 Rastrear pedido</h2>' +
          '<p style="color:var(--text3);font-size:0.85rem;margin-bottom:12px">Digite o código do pedido (ex.: P-XXXXX) recebido na confirmação.</p>' +
          '<div class="field"><label>Código do pedido</label><input id="rastreioInput" placeholder="P-XXXXX" style="text-transform:uppercase"></div>' +
          '<div class="alert" id="alertRastreio">Pedido não encontrado. Verifique o código.</div>' +
          '<button class="btn" onclick="buscarRastreio()">Buscar</button>' +
          '<button class="btn ghost" style="margin-top:9px" onclick="ferrarRastreio()">Fechar</button>';
      }
      document.getElementById('modalRastreio').classList.add('open');
    }
    function buscarRastreio() {
      const input = document.getElementById('rastreioInput');
      if (!input) return;
      const p = M.buscarPedido(input.value);
      if (!p) { document.getElementById('alertRastreio').classList.add('show'); return; }
      document.getElementById('alertRastreio') && document.getElementById('alertRastreio').classList.remove('show');
      abrirRastreio();
    }
    function ferrarRastreio() {
      document.getElementById('modalRastreio').classList.remove('open');
    }
    function stEmoji(s) {
      const map = { novo: '🆕', confirmado: '👌', em_preparo: '👨‍🍳', em_transito: '🛵', entregue: '✅', cancelado: '❌' };
      return map[s] || '📦';
    }
    function indiceStatus(p, id) {
      return (p.historico || []).findIndex(h => h.status === id);
    }
    function mapStatus(p) {
      const ordens = ['novo', 'confirmado', 'em_preparo', 'em_transito', 'entregue'];
      if (p.status === 'cancelado') return [{ id: 'novo', em: p.criadoEm }, { id: 'cancelado', em: (p.historico || []).find(h => h.status === 'cancelado')?.em }];
      return ordens.slice(0, ordens.indexOf(p.status) + 1).map(id => ({ id, em: (p.historico || []).find(h => h.status === id)?.em }));
    }
    function fmtData(iso) {
      try {
        return new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
      } catch (e) { return iso; }
    }

    document.getElementById('busca').addEventListener('input', e => {
      filtro = e.target.value;
      listarProdutos();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        fecharCarrinho(); fecharCheckout(); ferrarRastreio();
        document.getElementById('modalCheckout').classList.remove('open');
      }
    });

    M.iniciar().then(() => {
      aplicarConfig();
      listarCategorias();
      listarProdutos();
      atualizarUI();
    });
  </script></body>
</html>
